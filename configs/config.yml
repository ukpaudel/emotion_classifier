#config.yml
data:
  datasets: #can supply multiple dataset that are manually stored. need to create a .py file with a class
    - class_path: data.ravdess_dataset.RAVDESSDataset
      data_dir: 'data/ravdess/data'
    - class_path: data.cremad_dataset.CREMADataset
      data_dir: 'data/CREMA-D/data'
  sample_rate: 16000
  noise_dir: 'data/musan' #directory with noise to add to the training waverform.

model:
  encoder_name: "wavlm" #"hubert" #wav2vec2
  dropout: 0.5
  hidden_dim: 256 #256
  num_classes: 8
  freeze_encoder: true #if false, all layer are unfroozen. If true, they are all frozen, the next line will set the layers to be unfreezed.
  unfreeze_last_n_layers: 2
  num_domains: 2 #different types of data. It has to match with distinctive dataset we pass above. 
  grl_lambda: 0.1 #if grl_lambda = 0 we don't use adversarial network to forget about the data label. 

# tiplet loss function to make the latent feature more tighly distributed. The toptal loss is weighted 
triplet_loss:
  enable: True # Set to False to disable triplet loss
  margin: 1.0 # Hyperparameter for triplet loss (e.g., 0.2 to 1.0)
  distance_metric: "euclidean" # 'euclidean' or 'cosine'
  weight: 1 # Weight of triplet loss in total loss (e.g., 0.01 to 0.5)

# Adjust classification loss weight if needed, though 1.0 is common
classification_loss_weight: 1.0

training:
  batch_size: 8
  epochs: 20
  lr: 0.0001
  max_lr: 0.01
  min_lr: 0.00001
  scheduler: "cosine_warm_restarts" #cosine_warm_restarts, onecycle, cosine
  resume_training: false #this will load weights, schedular from checkpoint_path and rerun it.
  val_split: 0.2
  num_workers: 4 #cores-7, cpu cores to use, leave some cores for the os and other processes

pretrained_weights: #if enabled, it starts the training using weights from the pretrained weights, specify the weight file
  enabled: true
  checkpoint_path: "runs/emotion_classifier_exp9c/wavlm_2MLP_256HD_1Enc_wnoise_rand_clip_2s_0.5Drop/checkpoint.pt"

logging:
  log_dir: "runs/emotion_classifier_exp9d/" #this is a unique folder for the training. when it reruns it overrides and deletes the log file so update it as needed.
  run_label: "wavlm_2MLP_256HD_2Enc_wnoise_rand_clip_2s_0.5Drop" #unique id give to the training. 
  track_run: true #track different models trained so that we can plot them together.
  runs_config_path: "configs/model_runs.yml" #where to store info about different experimentation
  misclassified_dir: "misclassified/"
  checkpoint_dir: "checkpoints/"
  save_misclassified: false #save misclassified audios

notes: "Goal: Understand thye performance of wavlm encoder.
 Domain Adversarial training with lambda =0.1. Tiplet loss added with weight 0.1 and classification weight 1
 Only 2 wavlm encoder layer unfroozen, aggressive dropout 0.6.
 wavlm's output is SpecAugmented with random time and frequency masking
 training data augmented with musan noise, amplitude/Gain noise, time stretching   
 2-layer MLP classifier, 
 50 epochs, batch_size 8, lr: 0.0001, max_lr: 0.003, grl_lambda 3, dropout 0.5, triplet_loss weight 1
 "
